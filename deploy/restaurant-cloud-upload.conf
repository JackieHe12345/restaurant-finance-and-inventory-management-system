# Restaurant Cost Manager: allow a 25 MB XLSX plus multipart overhead.
client_max_body_size 26m;

# Always revalidate the entry document so a new deployment reaches Chrome,
# Safari, and other clients without asking each user to clear their cache.
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;
