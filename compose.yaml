services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://restaurant:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/restaurant
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TEST_LOGIN_ENABLED: ${TEST_LOGIN_ENABLED:-false}
      PAYMENT_SECRET_ROOT: /data/payment-secrets
    volumes:
      - payment-secrets:/data/payment-secrets
      - recovery-files:/opt/restaurant-cloud/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
  payment-secrets:
  recovery-files:
